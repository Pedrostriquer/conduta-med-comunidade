# Conduta Med em produção. Vive em /opt/conduta; o Caddy do host publica na internet (ver Caddyfile).
name: conduta
services:
  db:
    image: postgres:17-alpine
    container_name: conduta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduta
      POSTGRES_USER: conduta
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # memória pensada para uma VPS de 12 GB que hoje roda só isto
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=4GB -c work_mem=16MB -c maintenance_work_mem=256MB
      -c max_connections=40 -c wal_compression=on -c random_page_cost=1.1 -c effective_io_concurrency=100
      -c checkpoint_completion_target=0.9 -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduta -d conduta"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [conduta]

  api:
    build: ./server
    image: conduta-api:latest
    container_name: conduta-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8300"
      DATABASE_URL: postgres://conduta:${DB_PASSWORD}@db:5432/conduta
      PUBLIC_URL: ${PUBLIC_URL}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      CONFIRM_SECRET: ${CONFIRM_SECRET}
      SECRETS_KEY: ${SECRETS_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      DATA_DIR: /data/web/data
      TRANSCRIPTS_DIR: /data/transcricoes
      BANK_EXTRA_FILE: /data/banco/banco-extra.json
      BACKUPS_DIR: /data/backups
      UPLOADS_DIR: /data/uploads
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8300:8300"
    volumes:
      - /srv/conduta/web/data:/data/web/data:ro
      - /srv/conduta/transcricoes:/data/transcricoes:ro
      - /srv/conduta/banco:/data/banco:ro
      - /var/backups/conduta:/data/backups:ro
      - /srv/conduta/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1500m
    networks: [conduta]

volumes:
  pgdata:

networks:
  conduta:
